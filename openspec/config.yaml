schema: spec-driven

context: |
  本仓面向经典 ASP.NET Boilerplate 的独立维护与发行。各子模块的分工见 docs/README.md，发行策略见 docs/maintenance/fork-roadmap.md。
  既有 Abp 和 Abp.* 命名空间长期保持不变。Du. 仅用于 NuGet PackageId。发行包改名时保留既有 AssemblyName、RootNamespace 与公共类型全名。
  存量应用应保留正常业务行为。涉及 AutoMapper 时，覆盖配置、对象更新、集合映射和查询投影。安全修复造成的可观察差异需要明确记录并验证。
  应用须能在 Windows、Linux 和 macOS 原生进程中运行。按变更影响选择运行环境、数据库 Provider 和消费项目进行验证，以实际结果声明兼容范围。
  制品正文使用简体中文，保留工作流模板中供 CLI 解析的固定标题、关键字和复选框格式。

rules:
  proposal:
    - 列明涉及的子模块、发行物和消费项目，注明拟支持的范围及待确认的基线。
  specs:
    - 用可验证的场景说明消费者可观察的行为。涉及兼容性时，覆盖既有行为及有意改变的边界。
  design:
    - 涉及子模块或依赖变更时，记录上游基线、包身份和受影响的传递依赖。适用时说明迁移与回退方式。
  tasks:
    - 按仓库和依赖顺序安排实现、回归和主仓集成，并记录实际运行的验证结果。
    - 涉及包发行时，用实际候选包验证干净还原和代表性消费场景，核对依赖闭包及程序集。
