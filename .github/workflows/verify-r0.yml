name: R0 基线复验

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-r0.yml
      - .gitmodules
      - aspnetboilerplate
      - eng/verify.py
      - eng/tests/**
      - docs/maintenance/release-baseline.json
      - docs/maintenance/baseline-tools/**
      - docs/maintenance/baseline-evidence/nuget-restore.json
      - docs/maintenance/baseline-evidence/api/*.json

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-r0:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: 检出主仓输入
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: 执行 Python 定向验证
        run: |
          mkdir -p "$RUNNER_TEMP/r0-evidence"
          python3 eng/tests/run_verify_r0_tests.py 2>&1 | tee "$RUNNER_TEMP/r0-evidence/python-self-check.log"

      - name: 获取框架子模块历史
        run: |
          git submodule update --init --no-recommend-shallow -- aspnetboilerplate 2>&1 \
            | tee "$RUNNER_TEMP/r0-evidence/framework-checkout.log"

      - name: 安装 R0 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/r0-dotnet
        with:
          dotnet-version: '9.0.306'
          architecture: arm64
          skip-lts-prepass: true

      - name: 执行 R0 完整复验
        run: |
          python3 eng/verify.py --profile r0 \
            --evidence-root "$RUNNER_TEMP/r0-evidence" --work-root "$RUNNER_TEMP/r0-work" \
            2>&1 | tee "$RUNNER_TEMP/r0-evidence/verify-r0.log"

      - name: 上传当次复验证据
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-r0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r0-evidence/
          if-no-files-found: warn
